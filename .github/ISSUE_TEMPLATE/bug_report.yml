name: Bug report
description: Report a reproducible editor or renderer problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a fresh scene or a small CC0 example. Do not share private projects.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and GPU
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, console errors, or rendering evidence
